name: Paperitreidaus

on:
  schedule:
    - cron: '17 0 * * *'   # kerran päivässä klo 00:17 UTC, kun päivän kynttilä on sulkeutunut
  workflow_dispatch: {}     # voit ajaa myös käsin: Actions -> Paperitreidaus -> Run workflow

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run paper
      - name: Tallenna tulokset
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper docs data
          git diff --cached --quiet || git commit -m "Paperitreidaus $(date -u +%F)"
          git push
